<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1373" viewBox="0 0 680 1373"><title>The Archivist&apos;s Ink-Stained Wraith — Monster Birth Certificate</title><desc>The Archivist&apos;s Ink-Stained Wraith: It wanders through dust-choked digital vaults, clutching a quill made of unindexed scans and counting the rhythmic pulses of long-dead prose. Fictional creature inspired by drevendev/Scriptorium and DenisSergeevitch/ex-ussr-kinship-research. Brain: It calculates the density of sentences within a single literary work.. Body: It searches for traces of kinship across repressed military and deportation files.. Curse: It is doomed to endlessly count the words of a ghost&apos;s family tree.. Generated with @cf/google/gemma-4-26b-a4b-it.</desc><rect width="680" height="100%" fill="#f1e8cf"/><rect x="18" y="18" width="644" height="1337" fill="none" stroke="#7c8661" stroke-width="2"/><text x="48" y="60" fill="#333f37" font-family="Georgia, serif" font-size="14">FRANKENREPO · MONSTER BIRTH CERTIFICATE</text><text x="48" y="106" fill="#22372c" font-family="Georgia, serif" font-size="27">The Archivist&apos;s Ink-Stained Wraith</text><svg x="235" y="150" width="210" height="225"><ellipse cx="80" cy="158" rx="47" ry="7" fill="#10151c" opacity=".5"/><path d="M49 134h22v22H43v-9h6zM89 134h22v13h6v9H89z" fill="#905774"/><path d="M42 88h76v38l-14 15H56l-14-15z" fill="#905774" stroke="#342a38" stroke-width="4"/><path d="M46 94H32v30h13M114 94h14v30h-13" fill="none" stroke="#e4b1d1" stroke-width="10"/><path d="M56 93l24 15 24-15M80 108v31" fill="none" stroke="#342a38" stroke-width="3"/><path d="M42 42l15-17h46l15 17v30l-15 13H57L42 72z" fill="#e4b1d1" stroke="#342a38" stroke-width="4"/><path d="M42 66h-9v9h9M118 66h9v9h-9" fill="#adb3ae"/><path d="M78 30v15m-6-10h12m-12 7h12" stroke="#905774" stroke-width="2"/><g class="monster-eyes"><path d="M57 49h16v15H57zM87 49h16v15H87z" fill="#f7f0cc"/><path d="M64 53h6v9h-6zM90 53h6v9h-6z" fill="#20252b"/></g><path d="M71 75v-6h18v6" stroke="#342a38" stroke-width="3" fill="none"/><path d="M53 33L44 12l22 15M107 33l9-21-22 15" fill="#e6d8ae"/><path d="M59 112l8 8-8 8-8-8z" fill="#e8bd85"/><path d="M59 116v8m-4-4h8" stroke="#544e45" stroke-width="2"/></svg><text x="48" y="407" fill="#333f37" font-family="Georgia, serif" font-size="18">It wanders through dust-choked digital vaults, clutching</text><text x="48" y="432" fill="#333f37" font-family="Georgia, serif" font-size="18">a quill made of unindexed scans and counting the rhythmic</text><text x="48" y="457" fill="#333f37" font-family="Georgia, serif" font-size="18">pulses of long-dead prose.</text><text x="48" y="510" fill="#576746" font-family="Georgia, serif" font-size="12">BRAIN</text><text x="48" y="535" fill="#333f37" font-family="Georgia, serif" font-size="17">It calculates the density of sentences within a single</text><text x="48" y="560" fill="#333f37" font-family="Georgia, serif" font-size="17">literary work.</text><text x="48" y="609" fill="#576746" font-family="Georgia, serif" font-size="12">BODY</text><text x="48" y="634" fill="#333f37" font-family="Georgia, serif" font-size="17">It searches for traces of kinship across repressed</text><text x="48" y="659" fill="#333f37" font-family="Georgia, serif" font-size="17">military and deportation files.</text><text x="48" y="708" fill="#576746" font-family="Georgia, serif" font-size="12">CURSE</text><text x="48" y="733" fill="#333f37" font-family="Georgia, serif" font-size="17">It is doomed to endlessly count the words of a ghost&apos;s</text><text x="48" y="758" fill="#333f37" font-family="Georgia, serif" font-size="17">family tree.</text><text x="48" y="807" fill="#576746" font-family="Georgia, serif" font-size="12">POTENTIALLY USEFUL MUTATION</text><text x="48" y="832" fill="#333f37" font-family="Georgia, serif" font-size="17">A researcher could use the Kinship-Scriptorium-Mapper to</text><text x="48" y="857" fill="#333f37" font-family="Georgia, serif" font-size="17">take a Scriptorium literary analysis and transform it</text><text x="48" y="882" fill="#333f37" font-family="Georgia, serif" font-size="17">into a genealogical candidate list by cross-referencing</text><text x="48" y="907" fill="#333f37" font-family="Georgia, serif" font-size="17">character names with ex-USSR archive records.</text><text x="48" y="956" fill="#576746" font-family="Georgia, serif" font-size="18">“Why must every ancestor be measured by their sentence</text><text x="48" y="981" fill="#576746" font-family="Georgia, serif" font-size="18">count?”</text><text x="48" y="1020" fill="#576746" font-family="Georgia, serif" font-size="13">Speculative, not an evaluated recommendation.</text><text x="48" y="1059" fill="#576746" font-family="Georgia, serif" font-size="13">It is unclear if the mapping could distinguish between a fictional</text><text x="48" y="1084" fill="#576746" font-family="Georgia, serif" font-size="13">protagonist and a historical figure of the same name.</text><text x="48" y="1123" fill="#576746" font-family="Georgia, serif" font-size="12">drevendev/Scriptorium · UNKNOWN + DenisSergeevitch/ex-ussr-kinship-research ·</text><text x="48" y="1148" fill="#576746" font-family="Georgia, serif" font-size="12">MIT</text><text x="48" y="1187" fill="#576746" font-family="Georgia, serif" font-size="12">Generated with @cf/google/gemma-4-26b-a4b-it · useful</text><text x="48" y="1226" fill="#576746" font-family="Georgia, serif" font-size="11">2026-10-31T13:49:27.283Z · Fictional interpretation of bounded public GitHub data.</text><text x="48" y="1265" fill="#576746" font-family="Georgia, serif" font-size="10">Source: https://github.com/drevendev/Scriptorium</text><text x="48" y="1304" fill="#576746" font-family="Georgia, serif" font-size="10">Source: https://github.com/DenisSergeevitch/ex-ussr-kinship-research</text></svg>