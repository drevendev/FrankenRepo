cords into</text><text x="48" y="882" fill="#333f37" font-family="Georgia, serif" font-size="17">a genealogy-linked JSON summary.</text><text x="48" y="931" fill="#576746" font-family="Georgia, serif" font-size="18">“Deep within the stacks, a ledger begins to weep.”</text><text x="48" y="970" fill="#576746" font-family="Georgia, serif" font-size="13">Speculative, not an evaluated recommendation.</text><text x="48" y="1009" fill="#576746" font-family="Georgia, serif" font-size="13">It is unclear if the agent could reliably distinguish between a person&apos;s</text><text x="48" y="1034" fill="#576746" font-family="Georgia, serif" font-size="13">name and a book title in messy scans.</text><text x="48" y="1073" fill="#576746" font-family="Georgia, serif" font-size="12">drevendev/Scriptorium · UNKNOWN + DenisSergeevitch/ex-ussr-kinship-research ·</text><text x="48" y="1098" fill="#576746" font-family="Georgia, serif" font-size="12">MIT</text><text x="48" y="1137" fill="#576746" font-family="Georgia, serif" font-size="12">Generated with @cf/google/gemma-4-26b-a4b-it · useful</text><text x="48" y="1176" fill="#576746" font-family="Georgia, serif" font-size="11">2026-10-27T23:11:00.834Z · Fictional interpretation of bounded public GitHub data.</text><text x="48" y="1215" fill="#576746" font-family="Georgia, serif" font-size="10">Source: https://github.com/drevendev/Scriptorium</text><text x="48" y="1254" fill="#576746" font-family="Georgia, serif" font-size="10">Source: https://github.com/DenisSergeevitch/ex-ussr-kinship-research</text></svg>